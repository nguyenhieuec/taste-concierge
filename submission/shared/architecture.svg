<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14">
  <title>Taste Concierge architecture</title>
  <rect width="960" height="560" fill="#FBFBF9"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C5C57"/></marker>
  </defs>
  <g fill="#1D1D1B">
    <text x="32" y="44" font-size="22" font-weight="650">Taste Concierge: one request</text>
    <text x="32" y="68" fill="#5C5C57">Cloudflare Worker (Hono). Every place and score comes from Qloo; the model reads and writes, never picks.</text>
  </g>
  <g stroke="#DCDCD4" fill="#FFFFFF">
    <rect x="32" y="100" width="190" height="84" rx="8"/>
    <rect x="270" y="100" width="210" height="84" rx="8"/>
    <rect x="528" y="100" width="190" height="84" rx="8"/>
    <rect x="766" y="100" width="162" height="84" rx="8"/>
    <rect x="528" y="228" width="190" height="84" rx="8"/>
    <rect x="528" y="340" width="190" height="84" rx="8"/>
    <rect x="270" y="284" width="210" height="84" rx="8"/>
    <rect x="32" y="284" width="190" height="84" rx="8"/>
    <rect x="766" y="284" width="162" height="140" rx="8"/>
  </g>
  <g fill="#1D1D1B">
    <text x="48" y="128" font-weight="620">Browser or MCP client</text>
    <text x="48" y="150" fill="#5C5C57" font-size="12.5">"I love Khruangbin and</text>
    <text x="48" y="166" fill="#5C5C57" font-size="12.5">Grand Budapest. Lisbon?"</text>

    <text x="286" y="128" font-weight="620">1 Router model, tool call</text>
    <text x="286" y="150" fill="#5C5C57" font-size="12.5">Nemotron 3 Nano (Workers AI on demo)</text>
    <text x="286" y="166" fill="#5C5C57" font-size="12.5">plan_taste_search(seeds, venue, city)</text>

    <text x="544" y="128" font-weight="620">2 Qloo /search</text>
    <text x="544" y="150" fill="#5C5C57" font-size="12.5">each seed to a taste-graph</text>
    <text x="544" y="166" fill="#5C5C57" font-size="12.5">entity (artist, movie, book)</text>

    <text x="782" y="128" font-weight="620">D1 memory</text>
    <text x="782" y="150" fill="#5C5C57" font-size="12.5">seeds, city, venue</text>
    <text x="782" y="166" fill="#5C5C57" font-size="12.5">per browser id</text>

    <text x="544" y="256" font-weight="620">3 Qloo /v2/insights, 2 calls</text>
    <text x="544" y="278" fill="#5C5C57" font-size="12.5">places of the venue kind by fit,</text>
    <text x="544" y="294" fill="#5C5C57" font-size="12.5">share per seed, taste words</text>

    <text x="544" y="368" font-weight="620">3b in parallel</text>
    <text x="544" y="390" fill="#5C5C57" font-size="12.5">OpenKrill travel MCP (UK, US)</text>
    <text x="544" y="406" fill="#5C5C57" font-size="12.5">Tavily: events this month</text>

    <text x="286" y="312" font-weight="620">4 Writer model</text>
    <text x="286" y="334" fill="#5C5C57" font-size="12.5">Nemotron 3 Ultra (Workers AI on demo);</text>
    <text x="286" y="350" fill="#5C5C57" font-size="12.5">only Qloo picks, code adds notes</text>

    <text x="48" y="312" font-weight="620">Answer page</text>
    <text x="48" y="334" fill="#5C5C57" font-size="12.5">picks, fit, popularity,</text>
    <text x="48" y="350" fill="#5C5C57" font-size="12.5">driven-by split, trace in ms</text>

    <text x="782" y="312" font-weight="620">5 Taste test</text>
    <text x="782" y="334" fill="#5C5C57" font-size="12.5">model alone names 5</text>
    <text x="782" y="350" fill="#5C5C57" font-size="12.5">places; Qloo finds them</text>
    <text x="782" y="366" fill="#5C5C57" font-size="12.5">and scores both lists</text>
    <text x="782" y="382" fill="#5C5C57" font-size="12.5">on the same seeds</text>
    <text x="782" y="404" fill="#0B5CAD" font-size="12.5">held-out test: Qloo 6 of 8</text>
  </g>
  <g stroke="#5C5C57" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M222 142 H266"/>
    <path d="M480 142 H524"/>
    <path d="M718 142 H762"/>
    <path d="M623 184 V224"/>
    <path d="M623 312 V336"/>
    <path d="M528 270 H500 V300 H484"/>
    <path d="M528 382 H500 V340 H484"/>
    <path d="M270 326 H226"/>
    <path d="M127 368 V470 H847 V428"/>
  </g>
  <text x="300" y="462" fill="#5C5C57" font-size="12.5">"Run the test" sends the resolved seeds and pick ids to /api/proof</text>
  <g fill="#5C5C57" font-size="12.5">
    <text x="32" y="512">Live demo today: Cloudflare Workers AI runs the router and writer until NEBIUS_API_KEY is set; the page says so.</text>
    <text x="32" y="532">Without Qloo the concierge refuses to name places instead of letting the model guess.</text>
  </g>
</svg>
